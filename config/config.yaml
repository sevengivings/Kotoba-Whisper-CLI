paths:
  input: /workspace/input
  processing: /workspace/processing
  output: /workspace/output
  archive: /workspace/archive
  failed: /workspace/failed
  logs: /workspace/logs
  temp: /workspace/processing/temp

watcher:
  scan_interval_seconds: 5
  stable_check_interval_seconds: 5
  stable_required_checks: 3
  minimum_file_age_seconds: 10

model:
  name: kotoba-tech/kotoba-whisper-v2.2
  revision: null
  device: cuda:0
  dtype: float16
  attention_implementation: sdpa

inference:
  language: japanese
  chunk_length_s: 15
  batch_size: 8
  return_timestamps: true
  word_timestamps: true
  punctuation: true
  silence_split: true
  silence_threshold_db: -42dB
  min_silence_duration_s: 0.5
  min_subtitle_duration_s: 0.8
  word_max_gap_s: 0.5
  word_max_subtitle_duration_s: 4.5
  word_max_subtitle_chars: 42
  vad_pre_split: true
  vad_max_segment_duration_s: 30
  vad_min_speech_duration_s: 0.25
  vad_padding_s: 0.4
  vad_merge_gap_s: 0.0
  vad_refine_segment_start: true
  vad_refine_threshold_offset_db: 3.0
  vad_refine_pre_roll_s: 0.08
  vad_refine_frame_duration_s: 0.03
  vad_refine_min_consecutive_frames: 2
  vad_refine_max_adjustment_s: 3.0
  subtitle_merge_gap_s: 0.5
  subtitle_max_merged_duration_s: 6.0
  subtitle_max_merged_chars: 42
  fallback_subtitle_max_duration_s: 5.0
  fallback_subtitle_chars_per_second: 5.0
  fallback_subtitle_padding_s: 0.4
  fallback_subtitle_start_delay_s: 0.5
  filter_short_repeated_phrases: true
  filtered_short_phrases:
    - すみません。
  filtered_short_phrase_max_duration_s: 1.6
  filtered_always_phrases:
    - ごめん。
    - ありがとうございました。
  fallback_batch_sizes:
    - 4
    - 2
    - 1

output:
  write_srt: true
  write_txt: true
  write_raw_json: true
  write_process_json: true
  utf8_bom: false
  overwrite_existing: false

validation:
  enabled: true
  minimum_coverage_ratio: 0.70
  maximum_uncovered_tail_seconds: 300
  suspicious_result_destination: failed

recovery:
  retry_processing_files_on_start: true
  maximum_attempts: 3

logging:
  level: INFO
  keep_days: 30
